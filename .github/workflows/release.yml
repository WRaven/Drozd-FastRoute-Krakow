name: Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Android app
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Configure stable signing for the test APK
        if: github.ref == 'refs/heads/main'
        env:
          TEST_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          TEST_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          TEST_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          TEST_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$TEST_KEYSTORE_BASE64" || -z "$TEST_KEYSTORE_PASSWORD" || \
                -z "$TEST_KEY_ALIAS" || -z "$TEST_KEY_PASSWORD" ]]; then
            echo "STABLE_TEST_SIGNING_AVAILABLE=false" >> "$GITHUB_ENV"
            echo "::warning::Test signing secrets are missing; no test APK artifact will be uploaded."
            exit 0
          fi
          keystore_path="$RUNNER_TEMP/mpk-krakow-fastroute-test.jks"
          printf '%s' "$TEST_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          {
            printf 'TEST_KEYSTORE_FILE=%s\n' "$keystore_path"
            printf 'TEST_KEYSTORE_PASSWORD=%s\n' "$TEST_KEYSTORE_PASSWORD"
            printf 'TEST_KEY_ALIAS=%s\n' "$TEST_KEY_ALIAS"
            printf 'TEST_KEY_PASSWORD=%s\n' "$TEST_KEY_PASSWORD"
            echo "STABLE_TEST_SIGNING_AVAILABLE=true"
          } >> "$GITHUB_ENV"

      - name: Run unit tests, lint, and debug build
        env:
          APP_VERSION_NAME: 0.1.0-ci.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Version debug APK
        env:
          APP_VERSION_NAME: 0.1.0-ci.${{ github.run_number }}
          APP_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          apk_path="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk_path"
          versioned_path="app/build/outputs/apk/debug/Drozd-FastRoute-Krakow-v${APP_VERSION_NAME}-build${APP_VERSION_CODE}-debug.apk"
          mv "$apk_path" "$versioned_path"
        if: github.ref == 'refs/heads/main' && env.STABLE_TEST_SIGNING_AVAILABLE == 'true'

      - name: Upload debug APK artifact
        if: github.ref == 'refs/heads/main' && env.STABLE_TEST_SIGNING_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Drozd-FastRoute-Krakow-ci-build-${{ github.run_number }}
          path: app/build/outputs/apk/debug/Drozd-FastRoute-Krakow-*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Room schema
        uses: actions/upload-artifact@v4
        with:
          name: Drozd-FastRoute-Krakow-room-schema-build-${{ github.run_number }}
          path: app/schemas/**/*.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Build and publish APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK Platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate release tag and set Android version
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use vMAJOR.MINOR.PATCH (for example, v1.2.0)."
            exit 1
          fi
          version_name="${RELEASE_TAG#v}"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          {
            echo "APP_VERSION_NAME=$version_name"
            echo "APP_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

      - name: Configure stable signing compatible with existing installations
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.TEST_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::All four existing TEST_KEYSTORE/TEST_KEY signing secrets are required for compatible releases."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/mpk-krakow-fastroute-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Validate and build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.TEST_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.TEST_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.TEST_KEY_PASSWORD }}
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease

      - name: Version APK filename
        id: apk
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          apk_path="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$apk_path" ]]; then
            echo "::error::Release build did not produce an APK."
            exit 1
          fi
          versioned_path="app/build/outputs/apk/release/Drozd-FastRoute-Krakow-v${VERSION_NAME}-build${VERSION_CODE}.apk"
          mv "$apk_path" "$versioned_path"
          echo "path=$versioned_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Drozd-FastRoute-Krakow-${{ github.ref_name }}-build${{ steps.version.outputs.version_code }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: ${{ steps.apk.outputs.path }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "Android versionName: $VERSION_NAME"
            echo "Android versionCode: $VERSION_CODE"
            echo "Source commit: $GITHUB_SHA"
            echo
            echo "Install this APK over an existing installation signed with the same release key."
          } > "$notes_file"
          gh release create "$GITHUB_REF_NAME" "$APK_PATH" \
            --title "Drozd FastRoute $GITHUB_REF_NAME" \
            --notes-file "$notes_file" \
            --verify-tag
